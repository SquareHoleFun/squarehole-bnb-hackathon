[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Plain `new` in tests (forge 1.8 rewrites it to a deployCode helper, where expectRevert ends a test as a vacuous pass).
dynamic_test_linking = false
remappings = [
    "src/flap/=lib/flap-pool-launch/src/flap/",
    "forge-std/=lib/flap-pool-launch/lib/forge-std/src/",
    "@openzeppelin/=lib/flap-pool-launch/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin-contracts-upgradeable/=lib/flap-pool-launch/lib/openzeppelin-contracts-upgradeable/contracts/",
    "solady/=lib/flap-pool-launch/lib/solady/src/",
    "fee-rules/=../core/src/",
]
allow_paths = ["../core"]
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]

[rpc_endpoints]
bsc_testnet = "https://bsc-testnet-rpc.publicnode.com"

[fmt]
line_length = 120

[lint]
lint_on_build = false
