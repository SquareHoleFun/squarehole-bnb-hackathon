  <body>
    <main class="page">
      <header class="intro">
        <!--
          The logo animation: the brand mark in layers, and five plain shapes that drop into its hole one after another,
          looping without end. Only CSS moves it (styles.css). With reduced motion the shapes stay hidden and
          the still mark shows. Decorative: the name is the heading below.
        -->
        <div class="mark" aria-hidden="true">
          <svg class="mark__layer" viewBox="-48 -48 352 352" focusable="false">
            <defs>
              <linearGradient id="mf" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1D2B46" />
                <stop offset="1" stop-color="#0B111D" />
              </linearGradient>
              <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFFFFF" stop-opacity=".09" />
                <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="mr" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#C4B2FF" stop-opacity=".8" />
                <stop offset=".5" stop-color="#6D4AE2" stop-opacity=".35" />
                <stop offset="1" stop-color="#6D4AE2" stop-opacity=".6" />
              </linearGradient>
              <linearGradient id="mw" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2A1D3A" />
                <stop offset=".6" stop-color="#05070C" />
              </linearGradient>
            </defs>
            <rect width="256" height="256" rx="58" fill="url(#mf)" />
            <rect width="256" height="256" rx="58" fill="url(#mg)" />
            <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="url(#mr)" stroke-width="3" />
            <rect x="76" y="76" width="104" height="104" rx="6" fill="url(#mw)" />
          </svg>
          <svg class="mark__layer mark__glow" viewBox="-48 -48 352 352" focusable="false">
            <defs>
              <radialGradient id="ms" cx=".5" cy=".5" r=".5">
                <stop offset=".45" stop-color="#A78BFA" stop-opacity=".32" />
                <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
              </radialGradient>
              <filter id="mb" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="7" />
              </filter>
            </defs>
            <path d="M20 20H236V236H20ZM82 76H174A6 6 0 0 1 180 82V174A6 6 0 0 1 174 180H82A6 6 0 0 1 76 174V82A6 6 0 0 1 82 76Z" fill="url(#ms)" fill-rule="evenodd" />
            <rect x="71" y="71" width="114" height="114" rx="11" fill="none" stroke="#A78BFA" stroke-width="10" filter="url(#mb)" />
          </svg>
          <svg class="mark__layer mark__flash" viewBox="-48 -48 352 352" focusable="false">
            <defs>
              <radialGradient id="mh" cx=".5" cy=".58" r=".55">
                <stop offset="0" stop-color="#C4B2FF" stop-opacity=".7" />
                <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
              </radialGradient>
            </defs>
            <rect x="76" y="76" width="104" height="104" rx="6" fill="url(#mh)" />
          </svg>
          <svg class="mark__layer" viewBox="-48 -48 352 352" focusable="false">
            <defs>
              <filter id="mc" x="-10%" y="-10%" width="120%" height="120%">
                <feGaussianBlur stdDeviation="1.1" />
              </filter>
            </defs>
            <rect x="71" y="71" width="114" height="114" rx="11" fill="none" stroke="#A78BFA" stroke-width="10" />
            <rect x="71" y="71" width="114" height="114" rx="11" fill="none" stroke="#F4F0FF" stroke-width="3.5" filter="url(#mc)" />
          </svg>
          <svg class="mark__layer mark__shape mark__shape--1" viewBox="-48 -48 352 352" focusable="false">
            <g transform="translate(128 128)" stroke-linejoin="round" stroke-width="3">
              <path d="M0-37L32-18.5L0 0L-32-18.5Z" fill="#CFC8FF" stroke="#CFC8FF" />
              <path d="M-32-18.5L0 0V37L-32 18.5Z" fill="#9F93F2" stroke="#9F93F2" />
              <path d="M32-18.5L0 0V37L32 18.5Z" fill="#7C6FDB" stroke="#7C6FDB" />
            </g>
          </svg>
          <svg class="mark__layer mark__shape mark__shape--2" viewBox="-48 -48 352 352" focusable="false">
            <g transform="translate(128 128)">
              <circle r="36" fill="#3F98DE" />
              <circle cx="-4" cy="-4" r="31" fill="#6CC4FF" />
              <ellipse cx="-13" cy="-15" rx="9" ry="6" transform="rotate(-30 -13 -15)" fill="#E3F4FF" />
            </g>
          </svg>
          <svg class="mark__layer mark__shape mark__shape--3" viewBox="-48 -48 352 352" focusable="false">
            <g transform="translate(128 128)" stroke-linejoin="round" stroke-width="3">
              <path d="M0-38L-38 24L4 36Z" fill="#FF9A55" stroke="#FF9A55" />
              <path d="M0-38L4 36L38 22Z" fill="#DB6A26" stroke="#DB6A26" />
            </g>
          </svg>
          <svg class="mark__layer mark__shape mark__shape--4" viewBox="-48 -48 352 352" focusable="false">
            <g transform="translate(128 131.8)" stroke-linejoin="round">
              <path d="M0-40L9.99-13.75L38.04-12.36L16.17 5.25L23.51 32.36L0 17L-23.51 32.36L-16.17 5.25L-38.04-12.36L-9.99-13.75Z" fill="#22C3C9" stroke="#22C3C9" stroke-width="7" />
              <path d="M0-40L9.99-13.75L38.04-12.36L16.17 5.25L23.51 32.36L0 17L-23.51 32.36L-16.17 5.25L-38.04-12.36L-9.99-13.75Z" transform="translate(-3 -4) scale(.42)" fill="#7FE3E6" stroke="#7FE3E6" stroke-width="7" />
            </g>
          </svg>
          <svg class="mark__layer mark__shape mark__shape--5" viewBox="-48 -48 352 352" focusable="false">
            <g transform="translate(128 130)">
              <path d="M0 34C-30 14-40-2-40-14C-40-30-26-38-16-38C-7-38-2-32 0-26C2-32 7-38 16-38C26-38 40-30 40-14C40-2 30 14 0 34Z" fill="#FF7EB6" />
              <ellipse cx="-19" cy="-21" rx="8" ry="5" transform="rotate(-35 -19 -21)" fill="#FFD3E6" />
            </g>
          </svg>
        </div>
        <h1 class="name"><img src="/brand/wordmark.svg" width="758" height="128" alt="Square Hole" /></h1>
        <p class="tagline">Different shapes. Same hole.</p>

        <source type="image/webp" srcset="/art/stage-1600x400.webp 1600w, /art/stage-2800x700.webp 2800w" sizes="(min-width: 1600px) 1600px, 100vw" width="1600" height="400" />
        <img src="/art/stage-1600x400.png" width="1600" height="400" decoding="async" fetchpriority="high" alt="A smiling lavender cube sits in the glowing square hole of a wooden toy box, under a soft spotlight. Plain lavender shapes stand in line on either side: a pentagon, an egg, a ball, a triangle and a heart on the left; a star, an arch, a cylinder, a hexagon and a pyramid on the right." />
      </picture>

      <p class="note">Square Hole is in development.</p>

        </svg>
        <span>@squarehole_</span>

    </main>
