<title>GPU Poor cover</title>
<desc>GPU POOR in hot glowing letters, with the line SELL A STOCK TO PROP UP A MEMECOIN under it. Below, ice-blue coins over the word $NVDA become chips over the word VRAM, and the chips burn in a fire.</desc>
