<title>GPU Poor story, scene 05: Both sides</title>
<desc>On the left, a buy turns a coin labeled $NVDA into a VRAM chip. On the right, a sale turns a VRAM chip into a coin labeled $NVDA. Each drops a 1% fee coin, and both arrows lead to one fire.</desc>
