<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
<title>GPU Poor story, scene 01: No GPU</title>
<desc>The dashed outline of a missing GPU hangs over an empty slot. Below it, a glass pool tank holds ice-blue $NVDA coins and VRAM chips. One arrow takes a coin labeled $NVDA in, another brings a chip labeled VRAM out.</desc>
