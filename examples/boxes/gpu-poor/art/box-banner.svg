<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="600" viewBox="0 0 2400 600" role="img">
<title>GPU Poor box banner</title>
<desc>A long dark ground. On the left, two dashed outlines of missing GPUs over empty slots. In the middle, GPU POOR in hot glowing letters. On the right, ice-blue coins over the word $NVDA become chips over the word VRAM, and the chips burn in a fire.</desc>
