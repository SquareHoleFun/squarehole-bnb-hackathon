<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img">
<title>GPU Poor X banner</title>
<desc>GPU POOR in hot glowing letters on a dark ground. Top left, the dashed outline of a missing GPU over an empty slot. Below the name, ice-blue coins over the word $NVDA become chips over the word VRAM, and the chips burn in a fire.</desc>
