<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
<title>Bag Holders story, scene 04: Bags outside</title>
<desc>A tote on a hook has gold coins in its pocket. A pointer clicks CLAIM and the coins fly out. Below, a small bag moves to a new hook with its coins, marked SOLD.</desc>
