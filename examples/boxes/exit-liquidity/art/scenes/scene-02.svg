<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
<title>Exit Liquidity story, scene 02: Fifteen coins</title>
<desc>A 1% fee coin in USDC splits into fifteen small coins. Ten go to the box rule, which sends buys to the pool and sells to the signs. Two go to the pool and three go to a plate marked SQUARE HOLE.</desc>
