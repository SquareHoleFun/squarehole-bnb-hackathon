<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
<title>Link Marines, version 2, story scene 06: Rules that stay</title>
<desc>A steel plaque held by four bolts says SAME RATION FOR ALL 420. Below it hangs a padlock with no keyhole, and beside it a key is crossed out. Three plates with one gold coin each stand on the table.</desc>
