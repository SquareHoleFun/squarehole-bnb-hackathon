<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
<title>Link Marines, version 2, story scene 05: Still in the box</title>
<desc>Marines in white caps peek out of the crate marked 420. Their gold coins fly along an arrow into a sage pool, where the water on a depth post has risen and an arrow points up.</desc>
