<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img">
<title>Link Marines, version 2, logo</title>
<desc>A round khaki patch with a stitched edge on a walnut panelled wall. Inside it, a young marine in a white peaked cap with a plain gold coin as its badge grins under the visor, in a dress-navy jacket with a bow tie.</desc>
