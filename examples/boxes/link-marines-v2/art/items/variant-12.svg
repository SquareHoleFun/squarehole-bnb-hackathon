<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img">
<title>Link Marines, version 2, variant 12: General</title>
<desc>The oldest marine, with a big white mustache, white brows, a napkin tucked in and the widest white peaked cap with a khaki edge on its visor, smiles and holds up a spoon. On the table are the same plate with one gold coin and a place card that says GENERAL.</desc>
