<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img">
<title>Link Marines, version 2, variant 07: Sergeant Major</title>
<desc>A marine with a curled mustache and raised brows in a white peaked cap reads a folded menu card. On the table are a plate with one gold coin and a place card that says SERGEANT MAJOR.</desc>
