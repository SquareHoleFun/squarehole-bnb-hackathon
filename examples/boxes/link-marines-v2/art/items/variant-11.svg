<title>Link Marines, version 2, variant 11: Colonel</title>
<desc>An officer with a red nose and a white peaked cap with a khaki cord blows on a steaming tin mug of cocoa. On the table are a plate with one gold coin and a place card that says COLONEL.</desc>
