<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img">
<title>Link Marines, version 2, variant 08: Lieutenant</title>
<desc>A young officer with wide eyes and a wider white peaked cap with a khaki cord cheers and raises a glass of water. On the table are a plate with one gold coin and a place card that says LIEUTENANT.</desc>
