<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img">
<title>Link Marines story, scene 05: The locker with no key</title>
<desc>Gold coins with bites out of them drop into a steel footlocker marked NO KEY. Its padlock has no keyhole, and beside it a key is crossed out. Above it are the words LOCKED FOR GOOD.</desc>
